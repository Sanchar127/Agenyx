repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: golangci-lint-router
        name: golangci-lint (router)
        entry: bash -c 'cd router && golangci-lint run ./...'
        language: system
        pass_filenames: false
        files: ^router/.*\.go$
