worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    sendfile on;

    # ---------------------------------------------------------
    # Logging
    # ---------------------------------------------------------

    log_format agenyx_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log agenyx_json;
    error_log /var/log/nginx/error.log warn;

    # ---------------------------------------------------------
    # Rate limiting
    # ---------------------------------------------------------

    # 10 requests/second per client IP.
    # Small burst allows short traffic spikes.
    limit_req_zone $binary_remote_addr
        zone=agenyx_api:10m
        rate=10r/s;

    # ---------------------------------------------------------
    # Upstream Agenyx application
    # ---------------------------------------------------------

    upstream agenyx_agent {
        server agent:8000;
        keepalive 32;
    }

    # ---------------------------------------------------------
    # HTTP → HTTPS
    # ---------------------------------------------------------

    server {
        listen 80;

        server_name _;

        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------
    # HTTPS Gateway
    # ---------------------------------------------------------

    server {
        listen 443 ssl;
        http2 on;

        server_name _;

        # Development certificates.
        # Production certificates should come from a real CA.
        ssl_certificate /etc/nginx/certs/agenyx.crt;
        ssl_certificate_key /etc/nginx/certs/agenyx.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # -----------------------------------------------------
        # Security headers
        # -----------------------------------------------------

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # -----------------------------------------------------
        # Request limits
        # -----------------------------------------------------

        client_max_body_size 1m;

        # -----------------------------------------------------
        # Health endpoint
        # -----------------------------------------------------

        location = /health {
            proxy_pass http://agenyx_agent/health;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        # -----------------------------------------------------
        # Agent API
        # -----------------------------------------------------

        location /v1/ {
            limit_req zone=agenyx_api burst=20 nodelay;

            proxy_pass http://agenyx_agent;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header X-Request-ID $request_id;

            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        # -----------------------------------------------------
        # Everything else
        # -----------------------------------------------------

        location / {
            return 404;
        }
    }
}
