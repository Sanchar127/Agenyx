apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agenyx-alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: agenyx-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy

  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/part-of: agenyx-observability

    spec:
      serviceAccountName: agenyx-alloy

      containers:
        - name: alloy
          image: grafana/alloy:v1.11.0
          imagePullPolicy: IfNotPresent

          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data

          ports:
            - name: http
              containerPort: 12345
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: config
              mountPath: /etc/alloy

            - name: alloy-data
              mountPath: /var/lib/alloy/data

            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true

            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: agenyx-alloy

        - name: alloy-data
          emptyDir: {}

        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory

        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
            type: Directory
