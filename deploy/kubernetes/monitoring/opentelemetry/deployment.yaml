apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenyx-otel-collector
  namespace: monitoring
  labels:
    app.kubernetes.io/name: agenyx-otel-collector
    app.kubernetes.io/part-of: agenyx
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: agenyx-otel-collector

  template:
    metadata:
      labels:
        app.kubernetes.io/name: agenyx-otel-collector
        app.kubernetes.io/part-of: agenyx

    spec:
      serviceAccountName: agenyx-otel-collector

      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.139.0
          imagePullPolicy: IfNotPresent

          args:
            - "--config=/etc/otelcol-contrib/otel-collector-config.yaml"

          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP

            - name: otlp-http
              containerPort: 4318
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true

          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: agenyx-otel-collector
