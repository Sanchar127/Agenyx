apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agenyx-agent
  labels:
    app.kubernetes.io/name: agenyx-agent
    app.kubernetes.io/part-of: agenyx
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agenyx-agent
  namespaceSelector:
    matchNames:
      - agenyx
  endpoints:
    - port: http
      path: /metrics
      scheme: http
      interval: 15s
      scrapeTimeout: 10s
---
