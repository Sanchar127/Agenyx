apiVersion: v1
kind: Service
metadata:
  name: agenyx-agent
  labels:
    app.kubernetes.io/name: agenyx-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agenyx-agent
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: agenyx-inference
  labels:
    app.kubernetes.io/name: agenyx-inference
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agenyx-inference
  ports:
    - name: http
      port: 8004
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: agenyx-router
  labels:
    app.kubernetes.io/name: agenyx-router
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agenyx-router
  ports:
    - name: http
      port: 8005
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: agenyx-orchestrator
  labels:
    app.kubernetes.io/name: agenyx-orchestrator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agenyx-orchestrator
  ports:
    - name: http
