apiVersion: v1
kind: ConfigMap
metadata:
  name: agenyx-agent-config
  labels:
    app.kubernetes.io/name: agenyx-agent
data:
  AGENTYX_AGENT_HOST: "0.0.0.0"
  AGENTYX_AGENT_PORT: "8000"
  # Internal Kubernetes service address for the semantic router.
  AGENTYX_ROUTER_BASE_URL: "http://agenyx-router:8005"
  # OpenTelemetry — centralized observability (metrics, traces, logs).
  OTEL_SERVICE_NAME: "agenyx-agent"
  OTEL_SERVICE_NAMESPACE: "agenyx"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=agenyx,service.name=agenyx-agent"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://agenyx-otel-collector.monitoring.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agenyx-inference-config
  labels:
    app.kubernetes.io/name: agenyx-inference
data:
  HOST: "0.0.0.0"
  PORT: "8004"
  # Ollama runs on the Kubernetes node; reachable via hostAliases below.
  INFERENCE_BACKEND_BASE_URL: "http://host.kubernetes.internal:11434/v1"
  LOG_LEVEL: "INFO"
  INFERENCE_DEFAULT_MODEL: "llama3.2:3b"
  # OpenTelemetry — centralized observability.
  OTEL_SERVICE_NAME: "agenyx-inference"
  OTEL_SERVICE_NAMESPACE: "agenyx"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=agenyx,service.name=agenyx-inference"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://agenyx-otel-collector.monitoring.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agenyx-router-config
  labels:
    app.kubernetes.io/name: agenyx-router
data:
  AGENTYX_VALKEY_MASTER_NAME: "mymaster"
  AGENTYX_VALKEY_SENTINEL_ADDRS: "agenyx-valkey-sentinel-0.valkey-sentinel.agenyx.svc.cluster.local:26379,agenyx-valkey-sentinel-1.valkey-sentinel.agenyx.svc.cluster.local:26379,agenyx-valkey-sentinel-2.valkey-sentinel.agenyx.svc.cluster.local:26379"
  # OpenTelemetry — centralized observability.
  OTEL_SERVICE_NAME: "agenyx-router"
  OTEL_SERVICE_NAMESPACE: "agenyx"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=agenyx,service.name=agenyx-router"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://agenyx-otel-collector.monitoring.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agenyx-worker-config
  labels:
    app.kubernetes.io/name: agenyx-worker
data:
  AGENTYX_VALKEY_MASTER_NAME: "mymaster"
  AGENTYX_VALKEY_SENTINEL_ADDRS: "agenyx-valkey-sentinel-0.valkey-sentinel.agenyx.svc.cluster.local:26379,agenyx-valkey-sentinel-1.valkey-sentinel.agenyx.svc.cluster.local:26379,agenyx-valkey-sentinel-2.valkey-sentinel.agenyx.svc.cluster.local:26379"
  TASK_STREAM: "agenyx:tasks"
  CONSUMER_GROUP: "agenyx-workers"
  AGENT_URL: "http://agenyx-agent:8000"
  AGENT_TIMEOUT_SECONDS: "120"
  MAX_ATTEMPTS: "4"
  RETRY_BASE_DELAY_SECONDS: "5"
  RETRY_MAX_DELAY_SECONDS: "60"
  PENDING_IDLE_MS: "10000"
  PENDING_BATCH_SIZE: "10"
  # OpenTelemetry — centralized observability.
  OTEL_SERVICE_NAME: "agenyx-worker"
  OTEL_SERVICE_NAMESPACE: "agenyx"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=agenyx,service.name=agenyx-worker"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://agenyx-otel-collector.monitoring.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agenyx-orchestrator-config
  labels:
    app.kubernetes.io/name: agenyx-orchestrator
data:
  AGENTYX_ORCHESTRATOR_ADDR: ":8002"
  # Internal Kubernetes services.
  AGENTYX_AGENT_BASE_URL: "http://agenyx-agent:8000"
  AGENTYX_ROUTER_BASE_URL: "http://agenyx-router:8005"
  AGENTYX_WORKER_BASE_URL: "http://agenyx-worker:8003"
  # Internal request timeouts.
  AGENTYX_AGENT_TIMEOUT_SECONDS: "60"
  AGENTYX_ROUTER_TIMEOUT_SECONDS: "10"
  AGENTYX_WORKER_TIMEOUT_SECONDS: "10"
  # Valkey / Redis Streams — Sentinel discovers the writable primary.
  AGENTYX_VALKEY_MASTER_NAME: "mymaster"
  AGENTYX_VALKEY_SENTINEL_ADDRS: "agenyx-valkey-sentinel-0.valkey-sentinel.agenyx.svc.cluster.local:26379,agenyx-valkey-sentinel-1.valkey-sentinel.agenyx.svc.cluster.local:26379,agenyx-valkey-sentinel-2.valkey-sentinel.agenyx.svc.cluster.local:26379"
  AGENTYX_TASK_STREAM: "agenyx:tasks"
  AGENTYX_CONSUMER_GROUP: "agenyx-workers"
  # OpenTelemetry — centralized observability.
  OTEL_SERVICE_NAME: "agenyx-orchestrator"
  OTEL_SERVICE_NAMESPACE: "agenyx"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=agenyx,service.name=agenyx-orchestrator"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://agenyx-otel-collector.monitoring.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
