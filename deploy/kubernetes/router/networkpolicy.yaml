apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agenyx-router
  namespace: agenyx

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agenyx-router

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agenyx
      ports:
        - protocol: TCP
          port: 8005

  egress:

    # Valkey
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agenyx
      ports:
        - protocol: TCP
          port: 6379

    # Kubernetes DNS - UDP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # Kubernetes DNS - TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 53
