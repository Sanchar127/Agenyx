apiVersion: v1
kind: ConfigMap
metadata:
  name: agenyx-worker-config
  namespace: agenyx

data:
  AGENTYX_VALKEY_MASTER_NAME: "mymaster"

  AGENTYX_VALKEY_SENTINEL_ADDRS: "agenyx-valkey-sentinel-0.valkey-sentinel.agenyx.svc.cluster.local:26379,agenyx-valkey-sentinel-1.valkey-sentinel.agenyx.svc.cluster.local:26379,agenyx-valkey-sentinel-2.valkey-sentinel.agenyx.svc.cluster.local:26379"

  TASK_STREAM: "agenyx:tasks"
  CONSUMER_GROUP: "agenyx-workers"

  AGENT_URL: "http://agenyx-agent:8000"

  AGENT_TIMEOUT_SECONDS: "120"

  MAX_ATTEMPTS: "4"

  RETRY_BASE_DELAY_SECONDS: "5"
  RETRY_MAX_DELAY_SECONDS: "60"

  PENDING_IDLE_MS: "10000"
  PENDING_BATCH_SIZE: "10"
