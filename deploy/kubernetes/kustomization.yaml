apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ──────────────────────────────────────────────────────────────────────
# Agenyx — platform root kustomization
#
# Composes:
#   - namespace        : the `agenyx` namespace
#   - agenyx/          : all platform services in one consolidated,
#                        production-grade deployment
#   - monitoring/      : centralized observability (Prometheus, Grafana,
#                        Tempo, Loki, Alloy, OpenTelemetry)
# ──────────────────────────────────────────────────────────────────────

resources:
  - namespace.yaml
  - agenyx
  - monitoring
