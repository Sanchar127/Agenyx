apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agenyx-valkey
  namespace: agenyx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey

  policyTypes:
    - Ingress

  ingress:
    # Orchestrator -> Valkey
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agenyx-orchestrator
      ports:
        - port: 6379
          protocol: TCP

    # Worker -> Valkey
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agenyx-worker
      ports:
        - port: 6379
          protocol: TCP

    # Router -> Valkey
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agenyx-router
      ports:
        - port: 6379
          protocol: TCP

    # Sentinel -> Valkey
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey-sentinel
      ports:
        - port: 6379
          protocol: TCP
