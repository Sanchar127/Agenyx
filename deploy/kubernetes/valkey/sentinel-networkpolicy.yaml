apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agenyx-valkey-sentinel
  namespace: agenyx

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey-sentinel

  policyTypes:
    - Ingress

  ingress:
    # Sentinel ↔ Sentinel
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey-sentinel
      ports:
        - protocol: TCP
          port: 26379

    # Router → Sentinel
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agenyx-router
      ports:
        - protocol: TCP
          port: 26379
