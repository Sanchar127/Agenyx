apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenyx-worker
  namespace: agenyx
  labels:
    app.kubernetes.io/name: agenyx-worker
    app.kubernetes.io/part-of: agenyx

spec:
  replicas: 3

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: agenyx-worker

  template:
    metadata:
      labels:
        app.kubernetes.io/name: agenyx-worker
        app.kubernetes.io/part-of: agenyx

    spec:
      serviceAccountName: agenyx-worker
      automountServiceAccountToken: false

      terminationGracePeriodSeconds: 150

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: worker
          image: agenyx-worker:0.1.0
          imagePullPolicy: IfNotPresent

          env:
            - name: CONSUMER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: AGENTYX_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agenyx-valkey-secret
                  key: VALKEY_PASSWORD

            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agenyx-valkey-secret
                  key: VALKEY_PASSWORD

          envFrom:
            - configMapRef:
                name: agenyx-worker-config

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 1000m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway

          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agenyx-worker
