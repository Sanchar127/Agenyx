apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: agenyx
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: agenyx

spec:
  type: ClusterIP
  clusterIP: None

  # IMPORTANT:
  # Publish StatefulSet Pod DNS records even before Pods are Ready.
  # Sentinel needs to resolve:
  #   agenyx-valkey-0.valkey.agenyx.svc.cluster.local
  publishNotReadyAddresses: true

  selector:
    app.kubernetes.io/name: valkey

  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
