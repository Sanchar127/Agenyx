apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agenyx-inference
  namespace: agenyx
  labels:
    app.kubernetes.io/name: agenyx-inference
    app.kubernetes.io/part-of: agenyx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agenyx-inference

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Agenyx services
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: agenyx
      ports:
        - protocol: TCP
          port: 8004

    # Prometheus monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8004

  egress:
    - {}
