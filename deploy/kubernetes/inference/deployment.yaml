apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenyx-inference
  namespace: agenyx

  labels:
    app.kubernetes.io/name: agenyx-inference
    app.kubernetes.io/part-of: agenyx

spec:
  replicas: 1

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: agenyx-inference

  template:
    metadata:
      labels:
        app.kubernetes.io/name: agenyx-inference
        app.kubernetes.io/part-of: agenyx

    spec:
      serviceAccountName: agenyx-inference

      automountServiceAccountToken: false

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # Kubernetes is running directly on your Ubuntu host.
      #
      # This gives the pod a stable hostname for reaching
      # Ollama running on the host machine.
      hostAliases:
        - ip: "192.168.1.86"
          hostnames:
            - "host.kubernetes.internal"

      containers:
        - name: inference

          image: agenyx-inference:0.1.0

          imagePullPolicy: IfNotPresent

          # Explicitly start the FastAPI/Uvicorn server.
          # This avoids relying on the Docker image CMD.
          command:
            - uvicorn

          args:
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8004"

          ports:
            - name: http
              containerPort: 8004
              protocol: TCP

          envFrom:
            - configMapRef:
                name: agenyx-inference-config

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          securityContext:
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: "1"
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
