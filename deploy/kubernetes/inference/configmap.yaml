apiVersion: v1
kind: ConfigMap
metadata:
  name: agenyx-inference-config
  namespace: agenyx

data:
  HOST: "0.0.0.0"
  PORT: "8004"

  # Ollama is running on the Kubernetes host.
  # host.kubernetes.internal is provided through hostAliases below.
  OLLAMA_BASE_URL: "http://host.kubernetes.internal:11434/v1"

  LOG_LEVEL: "INFO"

  # Default model used by the inference backend.
  OLLAMA_MODEL: "llama3.2"

  # -------------------------------------------------------
  # OpenTelemetry
  # -------------------------------------------------------

  OTEL_SERVICE_NAME: "agenyx-inference"
  OTEL_SERVICE_NAMESPACE: "agenyx"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=agenyx"

  OTEL_EXPORTER_OTLP_ENDPOINT: "http://agenyx-otel-collector.monitoring.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"

  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
