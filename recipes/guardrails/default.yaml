apiVersion: agenyx.ai/v1alpha1
kind: GuardrailsRecipe

metadata:
  name: default-input-guardrails
  version: "1.0.0"

spec:
  input:
    enabled: true
    onError: block
    maxInputLength: 10000

    detectors:
      - type: prompt-injection
        enabled: true
        onViolation: block

      - type: jailbreak
        enabled: true
        onViolation: block

      - type: pii
        enabled: true
        onViolation: block
        categories:
          - email
          - phone
          - ip-address
          - credit-card
