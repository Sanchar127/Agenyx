services:

  # ─────────────────────────────────────────────
  # Agent - LLM reasoning and orchestration
  # ─────────────────────────────────────────────
  agent:
    build:
      context: ./internal/agent
      dockerfile: Dockerfile

    container_name: agenyx-agent

    env_file:
      - ./internal/agent/.env

    environment:
      AGENTYX_ROUTER_BASE_URL: ${AGENTYX_ROUTER_BASE_URL:-http://router:8005}
      AGENTYX_INFERENCE_BASE_URL: ${AGENTYX_INFERENCE_BASE_URL:-http://inference:8004}
      AGENTYX_SANDBOX_BASE_URL: ${AGENTYX_SANDBOX_BASE_URL:-http://sandbox:9000}
      AGENTYX_DATABASE_URL: ${AGENTYX_DATABASE_URL:?AGENTYX_DATABASE_URL must be set}

      AGENTYX_INFERENCE_SERVICE_API_KEY: ${INFERENCE_SERVICE_API_KEY:?INFERENCE_SERVICE_API_KEY must be set}
      AGENEYX_MCP_GATEWAY_TOKEN: ${AGENEYX_MCP_GATEWAY_TOKEN:?AGENEYX_MCP_GATEWAY_TOKEN must be set}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_started
      inference:
        condition: service_started
      router:
        condition: service_started

    restart: unless-stopped


  # ─────────────────────────────────────────────
  # PostgreSQL - durable Agent execution storage
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine

    container_name: agenyx-postgres

    environment:
      POSTGRES_DB: agenyx
      POSTGRES_USER: agenyx
      POSTGRES_PASSWORD: agenyx_dev_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U agenyx -d agenyx
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # ─────────────────────────────────────────────
  # Semantic Router - Go model selection service
  # ─────────────────────────────────────────────
  router:
    build:
      context: ./router
      dockerfile: Dockerfile

    container_name: agenyx-router

    environment:
      AGENTYX_VALKEY_URL: redis://valkey:6379/0

    expose:
      - "8005"

    ports:
      - "8005:8005"

    restart: unless-stopped


  # ─────────────────────────────────────────────
  # Sandbox - isolated tool execution
  # ─────────────────────────────────────────────
  sandbox:
    build:
      context: ./internal/sandbox
      dockerfile: Dockerfile

    container_name: agenyx-sandbox

    runtime: runsc

    expose:
      - "9000"

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 64

    tmpfs:
      - /tmp:size=16m,mode=1777

    restart: unless-stopped


  # ─────────────────────────────────────────────
  # Inference - OpenAI-compatible LLM gateway
  # ─────────────────────────────────────────────
  inference:
    build:
      context: ./inference
      dockerfile: Dockerfile

    container_name: agenyx-inference

    volumes:
      - ./inference:/app

    environment:
      INFERENCE_SERVICE_API_KEY: ${INFERENCE_SERVICE_API_KEY:?INFERENCE_SERVICE_API_KEY must be set}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "8004"

    ports:
      - "8004:8004"

    restart: unless-stopped


  # ─────────────────────────────────────────────
  # Worker - Python task worker
  # ─────────────────────────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile

    container_name: agenyx-worker

    volumes:
      - ./worker:/app

    environment:
      AGENTYX_VALKEY_URL: redis://valkey:6379/0
      AGENTYX_TASK_STREAM: agenyx:tasks
      AGENTYX_CONSUMER_GROUP: agenyx-workers
      AGENTYX_AGENT_URL: http://agent:8000

    depends_on:
      - valkey
      - agent

    restart: unless-stopped


  # ─────────────────────────────────────────────
  # Valkey
  # ─────────────────────────────────────────────
  valkey:
    image: valkey/valkey:9-alpine

    container_name: agenyx-valkey

    command:
      - valkey-server
      - --appendonly
      - "yes"

    volumes:
      - valkey_data:/data

    restart: unless-stopped


  # ─────────────────────────────────────────────
  # Gateway
  # ─────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: agenyx-gateway

    depends_on:
      - valkey
      - agent

    environment:
      AGENTYX_VALKEY_URL: redis://valkey:6379/0
      AGENEYX_API_KEY_PERMISSIONS: agents:run,tasks:read
      AGENEYX_API_KEY: ${AGENEYX_API_KEY:?AGENEYX_API_KEY must be set in .env}
      AGENEYX_AGENT_URL: http://agent:8000
      AGENEYX_CORS_ORIGIN: ${AGENEYX_CORS_ORIGIN:-http://localhost:3000}

    user: "1000:1000"

    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - ./deploy/certs:/etc/agenyx/certs:ro

    restart: unless-stopped


  # ─────────────────────────────────────────────
  # Website - Agenyx marketing site and AI Playground
  # ─────────────────────────────────────────────
  website:
    build:
      context: ./website
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AGENYX_API_URL: ${NEXT_PUBLIC_AGENYX_API_URL:-https://localhost:8443}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

    container_name: agenyx-website

    ports:
      - "3000:3000"

    depends_on:
      - gateway

    restart: unless-stopped


volumes:
  valkey_data:
  postgres_data:
