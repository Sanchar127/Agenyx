services:
  agent:
    build:
      context: ./agent
    container_name: agenyx-agent
    env_file:
      - ./agent/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    restart: unless-stopped

  gateway:
    image: nginx:1.29-alpine
    container_name: agenyx-gateway
    depends_on:
      - agent
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/certs:/etc/nginx/certs:ro
    restart: unless-stopped
