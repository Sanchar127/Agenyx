services:

  # ─────────────────────────────────────────────
  # Agent - LLM reasoning and orchestration
  # ─────────────────────────────────────────────
  agent:
    build:
      context: ./agent

    container_name: agenyx-agent

    env_file:
      - ./agent/.env

    environment:
      AGENTYX_ROUTER_BASE_URL: http://router:8005
      AGENTYX_INFERENCE_BASE_URL: http://inference:8004
      AGENTYX_SANDBOX_BASE_URL: http://sandbox:9000

    expose:
      - "8000"

    depends_on:
      - sandbox
      - inference
      - router

    restart: unless-stopped

    # ─────────────────────────────────────────────
  # Semantic Router - Go model selection service
  # ─────────────────────────────────────────────
  router:
    build:
      context: ./router

    container_name: agenyx-router

    environment:
      AGENTYX_VALKEY_URL: redis://valkey:6379/0

    expose:
      - "8005"

    ports:
      - "8005:8005"
    restart: unless-stopped


  # ─────────────────────────────────────────────
  # Sandbox - isolated tool execution
  # ─────────────────────────────────────────────
  sandbox:
    build:
      context: ./sandbox

    container_name: agenyx-sandbox

    runtime: runsc

    expose:
      - "9000"

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 64

    tmpfs:
      - /tmp:size=16m,mode=1777

    restart: unless-stopped
    # ─────────────────────────────────────────────
  # Inference - OpenAI-compatible LLM gateway
  # ─────────────────────────────────────────────
  inference:
    build:
      context: ./inference

    container_name: agenyx-inference

    environment:
      INFERENCE_BACKEND_BASE_URL: http://host.docker.internal:11434/v1
      INFERENCE_BACKEND_API_KEY: ollama

      INFERENCE_DEFAULT_MODEL: qwen2.5:7b

      INFERENCE_PROVIDER_NAMES: ollama-local

      INFERENCE_REQUEST_TIMEOUT_SECONDS: "120"
      INFERENCE_MAX_RETRIES: "2"
      INFERENCE_MAX_CONNECTIONS: "100"
      INFERENCE_MAX_KEEPALIVE_CONNECTIONS: "20"
      INFERENCE_MAX_FAILOVER_ATTEMPTS: "3"


    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "8004"

    # Keep this only if you intentionally want external access
    # to the inference service for development/testing.
    ports:
      - "8004:8004"

    restart: unless-stopped


  # ─────────────────────────────────────────────
  # Orchestrator
  # ─────────────────────────────────────────────
  orchestrator:
    build:
      context: ./orchestrator

    container_name: agenyx-orchestrator

    environment:
      AGENTYX_VALKEY_URL: redis://valkey:6379/0
      AGENTYX_TASK_STREAM: agenyx:tasks
      AGENTYX_CONSUMER_GROUP: agenyx-workers
      AGENTYX_AGENT_URL: http://agent:8000

    depends_on:
      - valkey
      - agent

    ports:
      - "8001:8001"

    restart: unless-stopped


  # ─────────────────────────────────────────────
  # Worker
  # ─────────────────────────────────────────────
  worker:
    build:
      context: ./worker

    container_name: agenyx-worker

    volumes:
      - ./worker:/app

    environment:
      AGENTYX_VALKEY_URL: redis://valkey:6379/0
      AGENTYX_TASK_STREAM: agenyx:tasks
      AGENTYX_CONSUMER_GROUP: agenyx-workers
      AGENTYX_AGENT_URL: http://agent:8000

    depends_on:
      - valkey
      - agent

    restart: unless-stopped


  # ─────────────────────────────────────────────
  # Valkey
  # ─────────────────────────────────────────────
  valkey:
    image: valkey/valkey:9-alpine

    container_name: agenyx-valkey

    command:
      - valkey-server
      - --appendonly
      - "yes"

    volumes:
      - valkey_data:/data

    restart: unless-stopped


  # ─────────────────────────────────────────────
  # Gateway
  # ─────────────────────────────────────────────
  gateway:
    image: nginx:1.29-alpine

    container_name: agenyx-gateway

    depends_on:
      - orchestrator

    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - ./gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/certs:/etc/nginx/certs:ro

    restart: unless-stopped


volumes:
  valkey_data:
